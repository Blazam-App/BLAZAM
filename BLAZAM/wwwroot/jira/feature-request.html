<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>
	<a href="#" id="myCustomTrigger" class='btn btn-primary btn-large'>Report feedback</a><br />

	<script type="text/javascript" src="https://blazam.atlassian.net/s/d41d8cd98f00b204e9800998ecf8427e-T/g2slup/b/0/c95134bc67d3a521bb3f4331beb9b804/_/download/batch/com.atlassian.jira.collector.plugin.jira-issue-collector-plugin:issuecollector/com.atlassian.jira.collector.plugin.jira-issue-collector-plugin:issuecollector.js?locale=en-US&collectorId=fe4d93e5"></script>

	<script type="text/javascript">
        console.log("register open feature request trigger");

		window.ATL_JQ_PAGE_PROPS = {
			"triggerFunction": function (showCollectorDialog) {
                console.log("registered trigger for open feature request");

				//Requires that jQuery is available!
                jQuery(document).on('openFeatureRequestDialog', function (e) {
					console.log("triggered  open feature request");
					e.preventDefault();
					showCollectorDialog();
				});
			}
		};</script>
	<script type="text/javascript">
		if (typeof jQuery != 'undefined') {
			// jQuery is loaded => print the version
			alert(jQuery.fn.jquery);
		}

		// Add a 2-second delay before triggering the event
		setTimeout(function () {
            console.log("attempt trigger open feature request");

			jQuery(document).trigger('myCustomEvent');
		}, 2000); // 2000 milliseconds = 2 seconds

	</script>
</body >
</html >
