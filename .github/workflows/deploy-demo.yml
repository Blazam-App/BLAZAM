# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions


name: Build and deploy Windows Demo

on:
  push:
    branches:
      - v1-Nightly
  workflow_dispatch:

jobs:
  deployWindows:
    runs-on: Demo
    permissions: write-all

    steps:
      - uses: actions/checkout@v2
      - name: Setup .NET Core SDK 10
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.x
      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: Shutdown Demo Website
        shell: pwsh
        run: |
          New-Item -Path "C:\inetpub\demo.blazam.org" -Name "app_offline.htm" -ItemType "file" -Force
          Start-Sleep -Seconds 5

      - name: dotnet publish
        run: dotnet publish -c Release -o C:\inetpub\demo.blazam.org BLAZAM/BLAZAM.csproj

      - name: Restart Demo Website
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          Remove-Item -Path "C:\inetpub\demo.blazam.org\app_offline.htm" -Force
  deployLinux:
    needs: deployWindows
    runs-on: [self-hosted, linux]
    permissions: write-all

    steps:
      - name: Clean existing release zips
        shell: bash
        run: |
          find . -maxdepth 1 -type f -name 'blazam-dev-beta-v*.zip' -print -delete || true

      - name: Download latest Nightly release artifact
        uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          tag: 'Nightly1'
          fileName: 'blazam-nightly-v*.zip'
      
      - name: Shutdown Demo Website
        shell: bash
        run: sudo systemctl stop blazam.service

      - name: Extract release zip
        run: |
          unzip -o "./blazam-nightly-v*.zip" -d /opt/blazam

      - name: Restart Demo Website
        shell: bash
        run: sudo systemctl start blazam.service

      - name: Delete downloaded zip
        shell: bash
        run: rm -f ./blazam-nightly-v*.zip
  test:
    needs: deployLinux
    runs-on: windows-latest
    permissions: write-all
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Setup .NET Core SDK 10
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build application (Release)
        run: dotnet build -c Release
      - name: Setup Playwright
        shell: pwsh
        run: |
          PlaywrightTests/bin/Release/net10.0/playwright.ps1 install; 
          
      - name: Test application
        run: dotnet test -c Release --no-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}